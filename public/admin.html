<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>シフト希望の一覧</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header style="max-width: 1200px">
      <h1>シフト希望の一覧</h1>
      <p>作成担当用の画面。</p>
    </header>

    <main class="wide">
      <!-- 管理用の合言葉 -->
      <section id="key-section" class="card" hidden style="max-width: 480px">
        <h2>管理用の合言葉</h2>
        <div class="row">
          <input id="key-input" type="password" autocomplete="off" />
          <button id="key-button" type="button" style="flex: 0 0 auto">OK</button>
        </div>
        <div id="key-message" class="message error"></div>
      </section>

      <div id="content" hidden>
        <section class="card">
          <div class="row" style="flex-wrap: wrap">
            <div style="min-width: 160px; flex: 0 0 auto">
              <label for="period-select">対象の月</label>
              <select id="period-select"></select>
            </div>
            <div id="summary" style="color: var(--muted)"></div>
            <button id="reload-button" type="button" style="flex: 0 0 auto">再読み込み</button>
          </div>
        </section>

        <section id="remind-card" class="card">
          <h2>提出のお願い（LINE）</h2>
          <p class="hint" id="remind-hint">
            締切の3日前（12日）と前日（14日）の12:00に、まだ提出していない人へLINEで自動送信。LINE連携していない人には届かない。
          </p>
          <ul id="remind-log" class="remind-log"></ul>
          <button id="remind-button" type="button">未提出の人に今すぐ送る</button>
          <div id="remind-message" class="message"></div>
        </section>

        <section id="requests-card" class="card" hidden>
          <h2 id="requests-title">変更の申請</h2>
          <ul id="requests-list" class="request-list"></ul>
        </section>

        <div class="table-wrap">
          <table id="grid" class="grid"></table>
        </div>
        <p class="hint" style="margin-top: 8px">
          時間記載なし→その人の基本の時間。
        </p>

        <section class="card" style="margin-top: 20px; max-width: 480px">
          <h2>スタッフの登録</h2>
          <p class="hint">ここで登録した名前が、スタッフがLINEで初めて開いたときの選択肢に出る。一度選ばれた名前はそのLINEアカウント専用になる。</p>
          <div class="row">
            <input id="staff-name" type="text" maxlength="30" placeholder="名前" />
            <button id="staff-add" type="button" style="flex: 0 0 auto">追加</button>
          </div>
          <div id="staff-message" class="message"></div>
          <ul id="staff-list" class="staff-list"></ul>
        </section>
      </div>
    </main>

    <script src="common.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
